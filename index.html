<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<title>HITO. — Photographer</title>
<style>
:root{--paper:#f4f1ea;--ink:#151310;--muted:#746f67;--safe-top:max(18px,env(safe-area-inset-top));--safe-bottom:max(18px,env(safe-area-inset-bottom))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;overflow-x:clip}body{min-width:0}a{color:inherit;text-decoration:none}canvas{display:block;width:100%;height:100%}
#canvasWrap{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(circle at 50% 20%,#fff 0,#faf8f3 36%,#eee8df 100%)}
#webgl{width:100%;height:100%}.scrollSpace{height:520svh;position:relative;z-index:1;pointer-events:none}.ui{position:fixed;inset:0;z-index:3;pointer-events:none;padding:var(--safe-top) 18px var(--safe-bottom)}
.top{display:flex;justify-content:space-between;align-items:flex-start}.logo{font-family:"Iowan Old Style","Palatino Linotype","YuMincho","Hiragino Mincho ProN",serif;font-size:27px;letter-spacing:.06em}.role{font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:rgba(21,19,16,.55)}
.heroCopy{position:absolute;left:18px;right:18px;bottom:calc(var(--safe-bottom) + 100px);transition:opacity .35s ease,transform .35s ease}.eyebrow{font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}.heroTitle{margin:10px 0 0;font-family:"Iowan Old Style","Palatino Linotype","YuMincho","Hiragino Mincho ProN",serif;font-size:clamp(34px,10.4vw,50px);font-weight:400;line-height:1.02;letter-spacing:-.045em}.heroMeta{margin-top:13px;font-size:10px;line-height:1.7;color:#4d4943}
.bottom{position:absolute;left:18px;right:18px;bottom:calc(var(--safe-bottom) + 18px);display:flex;justify-content:space-between;align-items:flex-end;gap:16px}.chapter{transition:opacity .3s ease,transform .3s ease}.chapterLabel{font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}.chapterName{margin-top:7px;font-family:"Iowan Old Style","Palatino Linotype","YuMincho","Hiragino Mincho ProN",serif;font-size:25px;line-height:1}.chapterMeta{margin-top:6px;font-size:9px;line-height:1.55;color:#625d56}.rightBox{display:flex;flex-direction:column;align-items:flex-end;gap:13px;pointer-events:auto}.dots{display:flex;gap:7px}.dots i{width:6px;height:6px;border-radius:50%;background:rgba(21,19,16,.15);transition:.3s}.dots i.on{background:#151310;transform:scale(1.3)}
.contact{display:inline-flex;align-items:center;gap:10px;padding:11px 16px;border:1px solid rgba(21,19,16,.16);border-radius:999px;background:rgba(255,255,255,.72);backdrop-filter:blur(10px);font-size:8px;letter-spacing:.18em;text-transform:uppercase;opacity:0;transform:translateY(10px);transition:.35s;pointer-events:auto}.contact.show{opacity:1;transform:none}.contact svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.3}
.loader{position:fixed;inset:0;z-index:20;background:#f4f1ea;display:grid;place-items:center;transition:opacity .5s ease,visibility .5s ease}.loader.done{opacity:0;visibility:hidden;pointer-events:none}.loadmark{font-family:"Iowan Old Style","Palatino Linotype",serif;font-size:30px;letter-spacing:.08em}.fallback{position:fixed;z-index:30;left:18px;right:18px;bottom:calc(var(--safe-bottom) + 18px);background:#fff;padding:14px 16px;border:1px solid rgba(0,0,0,.08);font-size:12px;line-height:1.6;display:none}
@media(max-width:340px){.heroTitle{font-size:30px}.chapterName{font-size:22px}}@media(min-width:700px){html{background:#d9d4ca}body{max-width:480px;margin:0 auto;box-shadow:0 0 80px rgba(0,0,0,.14)}}
</style>
</head>
<body>
<div class="loader" id="loader"><div class="loadmark">HITO.</div></div>
<div id="canvasWrap"><canvas id="webgl"></canvas></div>
<div class="ui">
  <div class="top"><div class="logo">HITO.</div><div class="role">Photographer</div></div>
  <div class="heroCopy" id="heroCopy"><div class="eyebrow">Photo Work</div><div class="heroTitle">Family<br>Portrait<br>Corporate</div><div class="heroMeta">Fukuyama, Hiroshima</div></div>
  <div class="bottom">
    <div class="chapter" id="chapter"><div class="chapterLabel" id="chapterLabel">Selected Work</div><div class="chapterName" id="chapterName">Photographer</div><div class="chapterMeta" id="chapterMeta">Family / Portrait / Corporate</div></div>
    <div class="rightBox"><div class="dots" id="dots"><i class="on"></i><i></i><i></i><i></i></div><a class="contact" id="contact" href="mailto:hello@hito.photo">Contact<svg viewBox="0 0 24 24"><path d="M5 12h14M14 7l5 5-5 5"/></svg></a></div>
  </div>
</div>
<div class="fallback" id="fallback">WebGLを開始できませんでした。SafariのWebGL設定と通信環境を確認してください。</div>
<div class="scrollSpace"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{
const loader=document.getElementById('loader'),fallback=document.getElementById('fallback');
if(!window.THREE){loader.classList.add('done');fallback.style.display='block';return}
const THREE=window.THREE,canvas=document.getElementById('webgl');
const scene=new THREE.Scene();scene.background=new THREE.Color(0xf4f1ea);scene.fog=new THREE.Fog(0xf4f1ea,13,45);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.setPixelRatio(Math.min(devicePixelRatio,1.55));renderer.setSize(innerWidth,innerHeight);
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,100);camera.position.set(0,0,9.5);
scene.add(new THREE.HemisphereLight(0xffffff,0xd8d0c5,2.3));const key=new THREE.DirectionalLight(0xffffff,1.2);key.position.set(-3,5,6);scene.add(key);
const world=new THREE.Group();scene.add(world);
const URL={
 family:'https://images.unsplash.com/photo-1716301149701-b1b0389b466f?auto=format&fit=crop&w=1200&q=86',
 portrait:'https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=1000&q=86',
 corporate:'https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&fit=crop&w=1400&q=86',
 people:'https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=1200&q=84'
};
const manager=new THREE.LoadingManager(()=>setTimeout(()=>loader.classList.add('done'),220));manager.onError=()=>{};const txLoader=new THREE.TextureLoader(manager);txLoader.setCrossOrigin('anonymous');
function tex(url){const t=txLoader.load(url);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t}
function frame(url,w,h,label){
 const g=new THREE.Group();
 const sh=new THREE.Mesh(new THREE.PlaneGeometry(w*1.07,h*1.07),new THREE.MeshBasicMaterial({color:0x5b5147,transparent:true,opacity:.08}));sh.position.set(.04,-.06,-.08);g.add(sh);
 const paper=new THREE.Mesh(new THREE.PlaneGeometry(w*1.045,h*1.045),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.82,metalness:0}));g.add(paper);
 const photo=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex(url),toneMapped:false}));photo.position.z=.025;g.add(photo);
 if(label){const c=document.createElement('canvas');c.width=512;c.height=84;const x=c.getContext('2d');x.fillStyle='rgba(255,255,255,.84)';x.fillRect(0,0,512,84);x.fillStyle='#655e56';x.font='500 28px Arial';x.fillText(label.toUpperCase(),26,53);const ct=new THREE.CanvasTexture(c);ct.colorSpace=THREE.SRGBColorSpace;const cap=new THREE.Mesh(new THREE.PlaneGeometry(w*.48,h*.115),new THREE.MeshBasicMaterial({map:ct,transparent:true}));cap.position.set(-w*.24,-h*.41,.045);g.add(cap)}
 return g
}
const F={
 hero:frame(URL.family,4.55,5.9,'Photographer'),family:frame(URL.family,3.7,4.5,'Family'),portrait:frame(URL.portrait,2.75,3.85,'Portrait'),corp:frame(URL.corporate,4.75,2.95,'Corporate'),
 a:frame(URL.people,2.05,1.55,''),b:frame(URL.portrait,1.75,2.1,''),c:frame(URL.corporate,2.3,1.45,''),d:frame(URL.family,1.8,2.15,'')};
F.hero.position.set(.2,.05,0);F.family.position.set(4.1,-1.05,-5.6);F.portrait.position.set(-4.05,-.55,-10.4);F.corp.position.set(3.6,1.2,-16.6);F.a.position.set(-3.8,1.85,-6.5);F.b.position.set(.15,2.25,-3.8);F.c.position.set(-4.4,1.35,-14.3);F.d.position.set(4.65,2.05,-12.2);
F.family.rotation.y=-.24;F.portrait.rotation.y=.28;F.corp.rotation.y=-.34;F.a.rotation.y=.25;F.b.rotation.y=-.12;F.c.rotation.y=.30;F.d.rotation.y=-.22;Object.values(F).forEach(o=>world.add(o));
const pg=new THREE.BufferGeometry(),N=90,pa=new Float32Array(N*3);for(let i=0;i<N;i++){pa[i*3]=(Math.random()-.5)*17;pa[i*3+1]=(Math.random()-.25)*10;pa[i*3+2]=4-Math.random()*30}pg.setAttribute('position',new THREE.BufferAttribute(pa,3));const dust=new THREE.Points(pg,new THREE.PointsMaterial({color:0xffffff,size:.035,transparent:true,opacity:.75}));scene.add(dust);
const timeline=[
 {t:0,p:[.2,.05,9.5],l:[.2,0,0],name:'Photographer',meta:'Family / Portrait / Corporate',label:'Selected Work',dot:0,h:1},
 {t:.18,p:[.12,.02,6.2],l:[.15,0,-.7],name:'Family',meta:'Family Photography',label:'Section',dot:1,h:.15},
 {t:.38,p:[2.45,-.35,1.15],l:[4.1,-1.0,-5.6],name:'Family',meta:'Kids / Couple / Newborn',label:'Section',dot:1,h:0},
 {t:.58,p:[-.75,.08,-3.6],l:[-4,-.5,-10.4],name:'Portrait',meta:'Portrait Photography',label:'Section',dot:2,h:0},
 {t:.79,p:[1.5,.55,-9.0],l:[3.6,1.1,-16.6],name:'Corporate',meta:'Corporate / Recruiting / Workplace',label:'Section',dot:3,h:0},
 {t:1,p:[0,.9,-12.2],l:[2.5,.8,-18],name:'Contact',meta:'Fukuyama, Hiroshima',label:'HITO.',dot:3,h:0}
].map(k=>({...k,p:new THREE.Vector3(...k.p),l:new THREE.Vector3(...k.l)}));
function state(q){for(let i=0;i<timeline.length-1;i++){const a=timeline[i],b=timeline[i+1];if(q>=a.t&&q<=b.t){const u=(q-a.t)/(b.t-a.t),e=u*u*(3-2*u);return{p:a.p.clone().lerp(b.p,e),l:a.l.clone().lerp(b.l,e),name:u<.5?a.name:b.name,meta:u<.5?a.meta:b.meta,label:u<.5?a.label:b.label,dot:u<.5?a.dot:b.dot,h:a.h+(b.h-a.h)*e}}}return timeline.at(-1)}
const heroCopy=document.getElementById('heroCopy'),nameEl=document.getElementById('chapterName'),metaEl=document.getElementById('chapterMeta'),labelEl=document.getElementById('chapterLabel'),contact=document.getElementById('contact'),dots=[...document.querySelectorAll('#dots i')];
let target=0,current=0,tx=0,ty=0,px=0,py=0;function update(){const max=Math.max(1,document.documentElement.scrollHeight-innerHeight);target=Math.min(1,Math.max(0,scrollY/max))}addEventListener('scroll',update,{passive:true});addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.55));camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();update()},{passive:true});addEventListener('pointermove',e=>{tx=(e.clientX/innerWidth-.5)*2;ty=(e.clientY/innerHeight-.5)*2},{passive:true});addEventListener('touchmove',e=>{if(e.touches[0]){tx=(e.touches[0].clientX/innerWidth-.5)*2;ty=(e.touches[0].clientY/innerHeight-.5)*2}},{passive:true});update();
const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const t=clock.getElapsedTime();current+=(target-current)*.075;px+=(tx-px)*.045;py+=(ty-py)*.045;const s=state(current);camera.position.lerp(s.p,.12);const look=s.l.clone();look.x+=px*.16;look.y-=py*.10;camera.lookAt(look);world.rotation.y=px*.035;world.rotation.x=-py*.018;F.family.rotation.y=-.24+Math.sin(t*.45)*.012;F.portrait.rotation.y=.28+Math.sin(t*.39+1)*.012;F.corp.rotation.y=-.34+Math.sin(t*.36+.5)*.009;F.b.position.y=2.25+Math.sin(t*.72)*.055;F.d.position.y=2.05+Math.sin(t*.68+1.2)*.055;dust.rotation.y=t*.018;heroCopy.style.opacity=Math.max(0,Math.min(1,s.h));heroCopy.style.transform=`translateY(${(1-s.h)*10}px)`;nameEl.textContent=s.name;metaEl.textContent=s.meta;labelEl.textContent=s.label;dots.forEach((d,i)=>d.classList.toggle('on',i===s.dot));contact.classList.toggle('show',current>.87);renderer.render(scene,camera)}loop();
})();
</script>
</body>
</html>
