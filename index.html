@keyframes heroIn{to{transform:scale(1)}}
.hero-media::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14svh;background:linear-gradient(180deg,rgba(247,243,235,0),var(--paper))}
.hero-ui{position:relative;z-index:2;min-height:100svh;padding:var(--safe-top) 18px var(--safe-bottom)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start}
.logo{font-size:28px;letter-spacing:.06em;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.16)}
.menu{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.16)}
.hero-card{position:absolute;left:18px;right:18px;bottom:calc(var(--safe-bottom) + 20px);background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border:1px solid rgba(20,18,16,.06);padding:18px 18px 20px;box-shadow:0 18px 50px rgba(0,0,0,.06)}
.eyebrow{font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.hero-title{margin:12px 0 0;font-size:clamp(34px,10.2vw,48px);font-weight:400;line-height:1.02;letter-spacing:-.045em}
.hero-meta{margin-top:16px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hero-meta .left{font-size:10px;line-height:1.7;color:#4c4843}
.hero-meta .right{font-size:8px;letter-spacing:.19em;text-transform:uppercase;color:#928a80;text-align:right}

/* INTRO */
.intro{background:var(--paper);padding:44px 24px 58px;text-align:center}
.intro .rule{width:54px;height:1px;background:var(--line);margin:0 auto 18px}
.intro h2{margin:0;font-size:clamp(26px,7.2vw,34px);font-weight:400;line-height:1.18;letter-spacing:-.04em}
.intro p{margin:12px 0 0;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

/* 3D GALLERY */
.gallery-wrap{position:relative;height:255svh;background:linear-gradient(180deg,#f6f1e8 0%,#f1ece2 42%,#fbfaf7 100%)}
.gallery-stage{position:sticky;top:0;height:100svh;overflow:hidden;perspective:1600px;perspective-origin:50% 42%}
.gallery-stage::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.7),transparent 55%) }
.gallery-floor{position:absolute;left:-20%;right:-20%;bottom:-22svh;height:65svh;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.45));transform:rotateX(76deg);transform-origin:center top;opacity:calc(.18 + var(--p) * .20)}
.gallery-floor::before{content:"";position:absolute;inset:0;background-image:linear-gradient(to right, rgba(20,18,16,.08) 1px, transparent 1px), linear-gradient(to bottom, rgba(20,18,16,.08) 1px, transparent 1px);background-size:48px 48px}
.gallery-world{position:absolute;left:50%;top:46%;width:100%;height:100%;transform-style:preserve-3d;transform:
  translate3d(-50%,-50%,0)
  rotateX(calc(10deg - var(--p) * 2deg))
  rotateY(calc(var(--p) * -12deg))
  translateZ(calc(var(--p) * -260px));
  will-change:transform;
}
.frame{position:absolute;background:#fff;padding:8px;box-shadow:var(--shadow);transform-style:preserve-3d;will-change:transform, opacity;border:1px solid rgba(20,18,16,.05)}
.frame picture, .frame img{width:100%;height:100%}
.frame .cap{position:absolute;left:10px;bottom:10px;padding:6px 8px;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:#625c55}
.frame.heroF{width:min(74vw,320px);height:50svh;max-height:470px;left:50%;top:48%;transform:translate3d(-50%,-50%,calc(var(--p) * -760px)) rotateY(calc(var(--p) * -10deg)) translateX(calc(var(--p) * -33vw)) translateY(calc(var(--p) * -3vh)) scale(calc(1 - var(--p) * .18));opacity:calc(1 - var(--p) * .08)}
.frame.familyF{width:min(58vw,260px);height:38svh;max-height:360px;left:50%;top:48%;transform:translate3d(calc(-50% + (1 - var(--p)) * 34vw),calc(-50% + (1 - var(--p)) * 18vh),calc(-520px + var(--p) * 350px)) rotateY(calc(11deg - var(--p) * 6deg)) rotateZ(calc(2deg - var(--p) * 2deg));opacity:calc(.12 + var(--p) * .88)}
.frame.portraitF{width:min(44vw,190px);height:33svh;max-height:320px;left:50%;top:48%;transform:translate3d(calc(-50% + (1 - var(--p)) * -38vw),calc(-50% + (1 - var(--p)) * 24vh),calc(-680px + var(--p) * 470px)) rotateY(calc(-14deg + var(--p) * 7deg)) rotateZ(calc(-2deg + var(--p) * 2deg));opacity:calc(.05 + var(--p) * .95)}
.frame.corpF{width:min(68vw,300px);height:27svh;max-height:250px;left:50%;top:48%;transform:translate3d(calc(-50% + (1 - var(--p)) * 36vw),calc(-50% + (1 - var(--p)) * -24vh),calc(-980px + var(--p) * 650px)) rotateY(calc(18deg - var(--p) * 10deg));opacity:calc(.02 + var(--p) * .98)}
.frame.detail1{width:min(26vw,110px);height:16svh;max-height:150px;left:50%;top:48%;transform:translate3d(calc(-50% + (1 - var(--p)) * -10vw),calc(-50% + (1 - var(--p)) * -31vh),calc(-380px + var(--p) * 140px)) rotateY(calc(-6deg + var(--p) * 4deg));opacity:calc(.22 + var(--p) * .78)}
.frame.detail2{width:min(32vw,138px);height:19svh;max-height:170px;left:50%;top:48%;transform:translate3d(calc(-50% + (1 - var(--p)) * 18vw),calc(-50% + (1 - var(--p)) * -34vh),calc(-1180px + var(--p) * 720px)) rotateY(calc(12deg - var(--p) * 6deg));opacity:calc(.01 + var(--p) * .99)}
.frame.detail3{width:min(30vw,130px);height:18svh;max-height:160px;left:50%;top:48%;transform:translate3d(calc(-50% + (1 - var(--p)) * -46vw),calc(-50% + (1 - var(--p)) * -14vh),calc(-1380px + var(--p) * 940px)) rotateY(calc(-18deg + var(--p) * 8deg));opacity:calc(.01 + var(--p) * .99)}
.frame.detail4{width:min(28vw,118px);height:17svh;max-height:150px;left:50%;top:48%;transform:translate3d(calc(-50% + (1 - var(--p)) * 46vw),calc(-50% + (1 - var(--p)) * 12vh),calc(-1420px + var(--p) * 860px)) rotateY(calc(16deg - var(--p) * 7deg));opacity:calc(.01 + var(--p) * .99)}
.gallery-copy{position:absolute;left:18px;right:18px;bottom:calc(var(--safe-bottom) + 24px);display:flex;justify-content:space-between;align-items:end;gap:16px;pointer-events:none}
.gallery-copy .l1{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#756e66}
.gallery-copy .l2{margin-top:8px;font-size:12px;line-height:1.6;color:#4e4a45}
.gallery-copy .r{font-size:8px;letter-spacing:.20em;text-transform:uppercase;color:#8f897f;text-align:right}
.gallery-title{position:absolute;left:50%;top:15%;transform:translateX(-50%);font-size:clamp(52px,16vw,86px);letter-spacing:.08em;color:rgba(20,18,16,.07);white-space:nowrap;pointer-events:none;opacity:calc(.4 + var(--p) * .5)}

/* STRIP */
.strip{background:#fffdf9;padding:22px 18px 26px}
.strip-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
.strip-head .a{font-size:8px;letter-spacing:.20em;text-transform:uppercase;color:#8a837a}
.strip-head .b{font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:#9d968d}
.strip-row{display:grid;grid-template-columns:1.1fr .84fr;grid-auto-rows:17svh;gap:8px;min-height:290px}
.strip-row figure{overflow:hidden;background:#ece5db}
.strip-row .one{grid-row:1 / span 2}
.strip-row .four{grid-column:1 / span 2}

/* END */
.end{min-height:84svh;background:var(--paper);padding:86px 24px var(--safe-bottom);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.end .mark{font-size:36px;letter-spacing:.08em}
.end .role{margin-top:10px;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#90897f}
.end .actions{margin-top:34px;display:flex;flex-direction:column;gap:12px;width:min(100%,210px)}
.end .btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:13px 18px;border:1px solid #b5aea4;border-radius:999px;font-size:9px;letter-spacing:.18em;text-transform:uppercase;background:#fff}
.end .btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.25}
.end small{margin-top:34px;font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:#a39b91}

<script>
(() => {
  const root = document.documentElement;
  const wrap = document.getElementById('galleryWrap');
  let ticking = false;
  const clamp = (v,min,max)=>Math.min(max,Math.max(min,v));
  function update(){
    ticking = false;
    const rect = wrap.getBoundingClientRect();
    const total = Math.max(1, rect.height - window.innerHeight);
    const progress = clamp((-rect.top) / total, 0, 1);
    root.style.setProperty('--p', progress.toFixed(4));
  }
  function onScroll(){
    if(!ticking){
      ticking = true;
      requestAnimationFrame(update);
    }
  }
  addEventListener('scroll', onScroll, {passive:true});
  addEventListener('resize', onScroll, {passive:true});
  update();
})();
</script>
