<!doctype html>
<html lang="ja">

<title>HITO. — Photographer</title>
<style>
:root{--paper:#f6f2ea;--ink:#16130f;--muted:#7a746b;--safe-top:max(18px,env(safe-area-inset-top));--safe-bottom:max(18px,env(safe-area-inset-bottom))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;overflow-x:clip}body{min-width:0}a{color:inherit;text-decoration:none}canvas{display:block;width:100%;height:100%}

.top{display:flex;justify-content:space-between;align-items:flex-start}.logo{font-family:"Iowan Old Style","Palatino Linotype","YuMincho","Hiragino Mincho ProN",serif;font-size:28px;letter-spacing:.06em}.role{font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:rgba(22,19,15,.55)}

.bottom{position:absolute;left:18px;right:18px;bottom:calc(var(--safe-bottom) + 18px);display:flex;justify-content:space-between;align-items:flex-end;gap:16px}.label{font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}.name{margin-top:7px;font-family:"Iowan Old Style","Palatino Linotype","YuMincho","Hiragino Mincho ProN",serif;font-size:26px;line-height:1}.meta{margin-top:6px;font-size:9px;line-height:1.55;color:#625d55}.right{display:flex;flex-direction:column;align-items:flex-end;gap:13px;pointer-events:auto}.dots{display:flex;gap:7px}.dots i{width:6px;height:6px;border-radius:50%;background:rgba(22,19,15,.15);transition:.3s}.dots i.on{background:#16130f;transform:scale(1.3)}

.loader{position:fixed;inset:0;z-index:20;background:#f6f2ea;display:grid;place-items:center;transition:opacity .5s ease,visibility .5s ease}.loader.done{opacity:0;visibility:hidden;pointer-events:none}.loadmark{font-family:"Iowan Old Style","Palatino Linotype",serif;font-size:30px;letter-spacing:.08em}.fallback{position:fixed;z-index:30;left:18px;right:18px;bottom:calc(var(--safe-bottom) + 18px);background:#fff;padding:14px 16px;border:1px solid rgba(0,0,0,.08);font-size:12px;line-height:1.6;display:none}
@media(max-width:340px){.heroTitle{font-size:30px}.name{font-size:23px}}@media(min-width:700px){html{background:#d9d4ca}body{max-width:480px;margin:0 auto;box-shadow:0 0 80px rgba(0,0,0,.14)}}
</style>
</head>
<body>
<div class="loader" id="loader"><div class="loadmark">HITO.</div></div>
<div id="wrap"><canvas id="webgl"></canvas></div>
<div class="ui">
  <div class="top"><div class="logo">HITO.</div><div class="role">Photographer</div></div>
  <div class="hero" id="hero"><div class="eyebrow">Photo Work</div><div class="heroTitle">Family<br>Portrait<br>Corporate</div><div class="heroMeta">Fukuyama, Hiroshima</div></div>

    <div><div class="label" id="label">Selected Work</div><div class="name" id="name">Photographer</div><div class="meta" id="meta">Family / Portrait / Corporate</div></div>
    <div class="right"><div class="dots" id="dots"><i class="on"></i><i></i><i></i><i></i></div><a class="contact" id="contact" href="mailto:hello@hito.photo">Contact<svg viewBox="0 0 24 24"><path d="M5 12h14M14 7l5 5-5 5"/></svg></a></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{

const manager=new THREE.LoadingManager(()=>setTimeout(()=>loader.classList.add('done'),180));const tl=new THREE.TextureLoader(manager);tl.setCrossOrigin('anonymous');function tex(u){const t=tl.load(u);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t}

function print(u,w,h,label,b=.13){const g=new THREE.Group(),a=new THREE.Mesh(new THREE.PlaneGeometry(w*1.75,h*1.75),new THREE.MeshBasicMaterial({map:radial(),transparent:true,opacity:.18,depthWrite:false,blending:THREE.AdditiveBlending}));a.position.z=-.24;g.add(a);const sh=new THREE.Mesh(new THREE.PlaneGeometry(w*1.07,h*1.07),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.07}));sh.position.set(.04,-.06,-.08);g.add(sh);const paper=new THREE.Mesh(bent(w*1.045,h*1.045,b*.9),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.84}));g.add(paper);const img=new THREE.Mesh(bent(w,h,b),new THREE.MeshBasicMaterial({map:tex(u),toneMapped:false}));img.position.z=.025;g.add(img);if(label)g.add(cap(label,w,h));g.userData.aura=a;return g}
const F={hero:print(URL.family,4.6,3.45,'Photographer',.10),family:print(URL.family,4.0,3.0,'Family',.17),portrait:print(URL.portrait,2.8,3.73,'Portrait',.18),corp:print(URL.corporate,4.8,3.2,'Corporate',.14),a:print(URL.people,1.9,1.9,'',.07),b:print(URL.portrait,1.55,2.07,'',.07),c:print(URL.corporate,2.2,1.47,'',.06),d:print(URL.family,1.85,1.39,'',.06)};
F.hero.position.set(0,.2,0);F.family.position.set(5.1,-.8,-7.0);F.portrait.position.set(-5.15,-.05,-13.1);F.corp.position.set(4.6,1.2,-20.0);F.a.position.set(-4.6,1.75,-8.1);F.b.position.set(-.8,2.2,-4.2);F.c.position.set(-4.8,1.2,-15.7);F.d.position.set(5.6,2.0,-14.0);F.family.rotation.y=-.28;F.portrait.rotation.y=.29;F.corp.rotation.y=-.36;F.a.rotation.y=.24;F.b.rotation.y=-.14;F.c.rotation.y=.31;F.d.rotation.y=-.19;Object.values(F).forEach(o=>world.add(o));
const shafts=[];[[-2.4,.9,-3.0,.17],[3.0,.5,-10.0,.15],[-2.8,1.2,-16.8,.14],[4.9,.8,-18.1,.14]].forEach((v,i)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(1.7,9),new THREE.MeshBasicMaterial({map:shaftTex(),transparent:true,opacity:v[3],depthWrite:false,blending:THREE.AdditiveBlending}));m.position.set(v[0],v[1],v[2]);m.rotation.y=(i%2?-.18:.16);world.add(m);shafts.push(m)});
const rings=[new THREE.Mesh(new THREE.TorusGeometry(2.35,.045,18,80),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.28})),new THREE.Mesh(new THREE.TorusGeometry(2.08,.04,18,80),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.20})),new THREE.Mesh(new THREE.TorusGeometry(1.88,.038,18,80),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.16}))];rings[0].position.set(1.8,.2,-2.8);rings[0].rotation.y=-.22;rings[1].position.set(-1,.2,-10.2);rings[1].rotation.y=.18;rings[2].position.set(2,.7,-17.3);rings[2].rotation.y=-.16;rings.forEach(r=>world.add(r));
const pg=new THREE.BufferGeometry(),N=110,pa=new Float32Array(N*3);for(let i=0;i<N;i++){pa[i*3]=(Math.random()-.5)*18;pa[i*3+1]=(Math.random()-.2)*11;pa[i*3+2]=5-Math.random()*32}pg.setAttribute('position',new THREE.BufferAttribute(pa,3));const dust=new THREE.Points(pg,new THREE.PointsMaterial({color:0xffffff,size:.04,transparent:true,opacity:.78}));scene.add(dust);
const cam=new THREE.CatmullRomCurve3([[0,.12,10.6],[0,.1,8.1],[.8,.18,4.4],[2,.34,1.8],[3.3,.16,-.8],[4.2,-.35,-5.7],[1.3,-.15,-8.8],[-2.5,.08,-11.0],[-4.6,0,-12.8],[-1.8,.9,-14.8],[1.6,1.1,-16.5],[4,1.0,-18.6],[1.1,.28,-14.1],[-.1,.1,-11.7]].map(v=>new THREE.Vector3(...v)),false,'catmullrom',.42);
const look=new THREE.CatmullRomCurve3([[0,0,0],[0,0,-.2],[1.0,0,-2],[5.1,-.8,-7],[5.1,-.8,-7],[0,0,-9.5],[-5.15,-.05,-13.1],[-5.15,-.05,-13.1],[0,.8,-15],[4.6,1.2,-20],[4.6,1.2,-20],[0,0,-15],[0,0,-14],[0,0,-14]].map(v=>new THREE.Vector3(...v)),false,'catmullrom',.42);
const phases=[{p:0,l:'Selected Work',n:'Photographer',m:'Family / Portrait / Corporate',d:0,h:1},{p:.2,l:'Section',n:'Family',m:'Family Photography',d:1,h:.15},{p:.5,l:'Section',n:'Portrait',m:'Portrait Photography',d:2,h:0},{p:.76,l:'Section',n:'Corporate',m:'Corporate / Recruiting / Workplace',d:3,h:0},{p:1,l:'HITO.',n:'Contact',m:'Fukuyama, Hiroshima',d:3,h:0}];const clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};function phase(q){for(let i=0;i<phases.length-1;i++){const a=phases[i],b=phases[i+1];if(q>=a.p&&q<=b.p){const u=(q-a.p)/(b.p-a.p||1);return{l:u<.5?a.l:b.l,n:u<.5?a.n:b.n,m:u<.5?a.m:b.m,d:u<.5?a.d:b.d,h:a.h+(b.h-a.h)*u}}}return phases.at(-1)}
const hero=document.getElementById('hero'),nameEl=document.getElementById('name'),metaEl=document.getElementById('meta'),labelEl=document.getElementById('label'),contact=document.getElementById('contact'),dots=[...document.querySelectorAll('#dots i')];let target=0,current=0,tx=0,ty=0,px=0,py=0;function scrollState(){const max=Math.max(1,document.documentElement.scrollHeight-innerHeight);target=clamp(scrollY/max,0,1)}addEventListener('scroll',scrollState,{passive:true});addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();scrollState()},{passive:true});addEventListener('pointermove',e=>{tx=(e.clientX/innerWidth-.5)*2;ty=(e.clientY/innerHeight-.5)*2},{passive:true});scrollState();
const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const t=clock.getElapsedTime();current+=(target-current)*.082;px+=(tx-px)*.05;py+=(ty-py)*.05;const e=ease(current),cp=cam.getPoint(e),lp=look.getPoint(e);camera.position.lerp(cp,.13);camera.fov=34+smooth(.10,.22,current)*3.8-smooth(.25,.37,current)*3.8+smooth(.52,.60,current)*2.2-smooth(.64,.72,current)*2.2;camera.updateProjectionMatrix();const aim=lp.clone();aim.x+=px*.14;aim.y-=py*.08;camera.lookAt(aim);world.rotation.y=px*.035;world.rotation.x=-py*.012;
const open=smooth(.07,.22,current);F.hero.position.x=-open*2.4;F.hero.position.y=.2-open*.15;F.hero.rotation.y=-.04-open*.68+Math.sin(t*.34)*.015;F.hero.userData.aura.material.opacity=.20-open*.15;

const pi=smooth(.42,.62,current);F.portrait.position.x=-6.35+pi*1.2;F.portrait.rotation.y=.50-pi*.21+Math.sin(t*.44+1.1)*.014;F.portrait.userData.aura.material.opacity=.03+smooth(.50,.66,current)*.18-smooth(.70,.79,current)*.13;
const ci=smooth(.68,.88,current);F.corp.position.x=5.5-ci*.9;F.corp.rotation.y=-.54+ci*.18+Math.sin(t*.38+.8)*.012;F.corp.userData.aura.material.opacity=.03+smooth(.76,.92,current)*.20;
F.b.position.y=2.2+Math.sin(t*.78)*.06;F.d.position.y=2+Math.sin(t*.72+1.3)*.055;shafts.forEach((s,i)=>{s.material.opacity=.10+Math.sin(t*.7+i)*.035+(i===0?smooth(.08,.24,current)*.06:0);s.rotation.z=Math.sin(t*.28+i)*.025});rings[0].rotation.z=t*.16;rings[1].rotation.z=-t*.11;rings[2].rotation.z=t*.075;dust.rotation.y=t*.02;
