.quote{position:absolute;inset:0;display:grid;place-items:center;padding:34px;text-align:center}
.quote h2{margin:0;max-width:12ch;font-family:"Iowan Old Style","Palatino Linotype","YuMincho","Hiragino Mincho ProN",serif;font-size:clamp(34px,9.8vw,50px);font-weight:400;line-height:1.24;letter-spacing:-.04em;opacity:0;transform:translateY(18px);will-change:transform,opacity;color:#6e6e6e}
.quote small{display:block;margin-top:18px;font-size:9px;letter-spacing:.12em;color:#aaa39b}
@supports (animation-timeline:view()){
.reveal-half,.quote h2{animation-duration:1ms;animation-fill-mode:both;animation-timing-function:linear;animation-timeline:--reveal;animation-range:entry 0% exit 100%}
.left{animation-name:splitLeft}.right{animation-name:splitRight}.quote h2{animation-name:quoteIn}
@keyframes splitLeft{0%,20%{transform:none}68%,100%{transform:translate3d(-61%,0,0)}}
@keyframes splitRight{0%,20%{transform:none}68%,100%{transform:translate3d(61%,0,0)}}
@keyframes quoteIn{0%,36%{opacity:0;transform:translateY(20px)}68%,100%{opacity:1;transform:none}}
}
@supports not (animation-timeline:view()){.reveal{height:auto}.reveal-stage{position:relative;height:85svh}.reveal-half{display:none}.quote h2{opacity:1;transform:none}}

.family:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02),transparent 48%,rgba(0,0,0,.68))}
.family-copy{position:absolute;z-index:2;left:18px;right:18px;bottom:calc(var(--safe-bottom) + 34px)}
.family-copy h2{margin:0;font-family:"Iowan Old Style","Palatino Linotype","YuMincho","Hiragino Mincho ProN",serif;font-size:clamp(39px,11.2vw,56px);line-height:1.03;font-weight:400;letter-spacing:-.05em}
.family-copy p{margin:15px 0 0;font-size:10.5px;line-height:1.8;color:rgba(255,255,255,.66);max-width:26ch}

.burst{height:76svh;min-height:520px;background:#050505;overflow:hidden;position:relative;view-timeline-name:--burst;view-timeline-axis:block;content-visibility:auto;contain-intrinsic-size:620px}
.strip{position:absolute;left:0;top:13%;height:60%;display:flex;gap:7px;width:max-content;will-change:transform}
.strip figure{width:58vw;max-width:275px;height:100%;overflow:hidden;background:#111;flex:none}
.strip figure:nth-child(2),.strip figure:nth-child(5){width:37vw;max-width:180px}.strip figure:nth-child(3){width:71vw;max-width:335px}
.strip img{filter:saturate(.86) contrast(1.05)}
.burst-line{position:absolute;z-index:2;left:18px;right:18px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:14px;pointer-events:none}
.burst-line:before,.burst-line:after{content:"";height:1px;background:rgba(255,255,255,.24);flex:1}.burst-line span{font-size:8px;letter-spacing:.28em;text-transform:uppercase;white-space:nowrap;color:rgba(255,255,255,.78)}
@supports (animation-timeline:view()){.strip{animation:stripRun 1ms linear both;animation-timeline:--burst;animation-range:entry 0% cover 100%}@keyframes stripRun{from{transform:translate3d(6vw,0,0)}to{transform:translate3d(-198vw,0,0)}}}

.breath{min-height:100svh;background:var(--paper);color:var(--ink);display:grid;place-items:center;padding:42px;content-visibility:auto;contain-intrinsic-size:844px}
.breath h2{margin:0;text-align:center;font-family:"Iowan Old Style","Palatino Linotype","YuMincho","Hiragino Mincho ProN",serif;font-size:clamp(37px,10.6vw,55px);font-weight:400;line-height:1.14;letter-spacing:-.046em}
.breath h2 em{font-style:normal;color:#aaa098}

.brand{min-height:100svh;background:#071019;color:#fff;padding:var(--safe-top) 18px calc(var(--safe-bottom) + 30px);display:flex;flex-direction:column;overflow:hidden;position:relative;content-visibility:auto;contain-intrinsic-size:844px}
.brand-title{font-family:"Iowan Old Style","Palatino Linotype","YuMincho","Hiragino Mincho ProN",serif;font-size:clamp(32px,9.2vw,44px);line-height:1.04;letter-spacing:-.046em;font-weight:400}.brand-title span{white-space:nowrap}
.brand-visual{margin:34px -18px 0;height:56svh;min-height:410px;overflow:hidden;position:relative}
